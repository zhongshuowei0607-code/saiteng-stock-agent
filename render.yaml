services:
  - type: web
    name: saiteng-stock-agent
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py server
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: WEB_HOST
        value: "0.0.0.0"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: LLM_PROVIDER
        value: "disabled"
