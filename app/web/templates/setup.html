<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Stock Agent 首次运行向导</title><link rel="stylesheet" href="/static/style.css"></head><body><main><header><div><div class="eyebrow">Stock Agent v1.0.0</div><h1>{{ '系统设置' if editing else '首次运行向导' }}</h1></div></header><div class="notice">密钥经加密后保存；容器环境变量优先。</div><form id="setup" class="panel"><h2>Step 1 · 数据源</h2><label>Tushare Token <input type="password" name="tushare_token" placeholder="{{ masked('TUSHARE_TOKEN') }}"></label><h2>Step 2 · LLM（可跳过）</h2><label>Provider <select name="llm_provider"><option>disabled</option><option>deepseek</option><option>openai</option><option>ollama</option></select></label><label>模型 <input name="llm_model" value="deepseek-chat"></label><label>DeepSeek Key <input type="password" name="deepseek_api_key" placeholder="{{ masked('DEEPSEEK_API_KEY') }}"></label><label>OpenAI Key <input type="password" name="openai_api_key" placeholder="{{ masked('OPENAI_API_KEY') }}"></label><h2>Step 3 · Bark</h2><label><input type="checkbox" name="bark_enabled"> 启用 Bark</label><label>Device Key <input type="password" name="bark_device_key" placeholder="{{ masked('BARK_DEVICE_KEY') }}"></label><h2>Step 4 · Email</h2><label><input type="checkbox" name="email_enabled"> 启用 Email</label><div class="details-grid"><label>SMTP Host <input name="smtp_host" value="smtp.qq.com"></label><label>端口 <input name="smtp_port" type="number" value="465"></label><label>用户名 <input name="smtp_user"></label><label>授权码 <input name="smtp_password" type="password" placeholder="{{ masked('SMTP_PASSWORD') }}"></label><label>发件人 <input name="smtp_from"></label><label>收件人 <input name="smtp_to"></label></div><h2>Step 5 · 持仓</h2><label>最大计划持仓 <input name="max_shares" type="number" value="1000"></label><p>默认：50 × 200 股，48 × 200 股。</p><h2>Step 6 · Dashboard 登录</h2><label>用户名 <input name="web_username" value="admin"></label><label>密码（至少10位） <input name="web_password" type="password" required minlength="10"></label><button type="submit">保存并开始运行</button><p id="result" role="status"></p></form><script>document.getElementById('setup').addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.target),v=n=>f.get(n)||'';const body={tushare_token:v('tushare_token'),llm_provider:v('llm_provider'),llm_model:v('llm_model'),deepseek_api_key:v('deepseek_api_key'),openai_api_key:v('openai_api_key'),bark_enabled:f.has('bark_enabled'),bark_device_key:v('bark_device_key'),email_enabled:f.has('email_enabled'),smtp_host:v('smtp_host'),smtp_port:Number(v('smtp_port')),smtp_use_ssl:true,smtp_user:v('smtp_user'),smtp_password:v('smtp_password'),smtp_from:v('smtp_from'),smtp_to:v('smtp_to'),web_username:v('web_username'),web_password:v('web_password'),max_shares:Number(v('max_shares')),buys:[{price:50,shares:200},{price:48,shares:200}],sells:[]};const r=await fetch('/api/setup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();document.getElementById('result').textContent=r.ok?'保存成功，请重新打开首页并登录':(d.detail||'保存失败');if(r.ok)setTimeout(()=>location.href='/',800)});</script></main></body></html>
