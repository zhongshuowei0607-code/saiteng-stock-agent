<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Stock Agent 设置</title><link rel="stylesheet" href="/static/style.css"><style>form label{display:block;margin:14px 0}input,select,textarea{display:block;width:100%;max-width:620px;padding:10px;margin-top:5px}textarea{min-height:90px}</style></head>
<body><main><header><div><div class="eyebrow">Stock Agent v1.0.0</div><h1>{{ '系统设置' if editing else '首次运行向导' }}</h1></div></header><div class="notice">密钥加密保存，环境变量优先；LLM 可保持 disabled。</div>
<form id="setup" class="panel">
<h2>Step 1 · 数据源</h2><label>Tushare Token<input type="password" name="tushare_token" placeholder="{{ masked('TUSHARE_TOKEN') }}"></label>
<h2>Step 2 · LLM</h2><label>Provider<select name="llm_provider">{% for name in ['disabled','deepseek','openai','ollama'] %}<option {{ 'selected' if config.llm.provider==name }}>{{ name }}</option>{% endfor %}</select></label><label>模型<input name="llm_model" value="{{ config.llm.model }}"></label><label>DeepSeek Key<input type="password" name="deepseek_api_key" placeholder="{{ masked('DEEPSEEK_API_KEY') }}"></label><label>OpenAI Key<input type="password" name="openai_api_key" placeholder="{{ masked('OPENAI_API_KEY') }}"></label>
<h2>Step 3 · Bark</h2><label><input type="checkbox" name="bark_enabled" {{ 'checked' if values.BARK_ENABLED | lower == 'true' }}> 启用 Bark</label><label>Device Key<input type="password" name="bark_device_key" placeholder="{{ masked('BARK_DEVICE_KEY') }}"></label>
<h2>Step 4 · Email</h2><label><input type="checkbox" name="email_enabled" {{ 'checked' if values.EMAIL_ENABLED | lower == 'true' }}> 启用 Email</label><div class="details-grid"><label>SMTP Host<input name="smtp_host" value="{{ values.SMTP_HOST or 'smtp.qq.com' }}"></label><label>端口<input name="smtp_port" type="number" value="{{ values.SMTP_PORT or 465 }}"></label><label>用户名<input name="smtp_user" value="{{ values.SMTP_USER }}"></label><label>授权码<input name="smtp_password" type="password" placeholder="{{ masked('SMTP_PASSWORD') }}"></label><label>发件人<input name="smtp_from" value="{{ values.SMTP_FROM }}"></label><label>收件人<input name="smtp_to" value="{{ values.SMTP_TO }}"></label></div>
<h2>Step 5 · 持仓与规则</h2><label>最大计划持仓<input name="max_shares" type="number" value="{{ portfolio.max_shares }}"></label><label>买入记录 JSON<textarea name="buys">{{ portfolio.buys | tojson }}</textarea></label><label>卖出记录 JSON<textarea name="sells">{{ portfolio.sells | tojson }}</textarea></label><div class="details-grid"><label>监控间隔（秒）<input name="monitor_interval" type="number" min="60" value="{{ config.monitor.interval_seconds }}"></label><label>风险提醒阈值<input name="risk_warning" type="number" value="{{ config.risk.warning_threshold }}"></label><label>严重风险阈值<input name="risk_critical" type="number" value="{{ config.risk.critical_threshold }}"></label><label>企稳阈值<input name="stabilization_threshold" type="number" value="{{ strategy.confirmation_score }}"></label></div>
<h2>Step 6 · 登录</h2><label>用户名<input name="web_username" value="{{ values.WEB_USERNAME or 'admin' }}"></label><label>密码（首次至少10位；编辑时留空保持原密码）<input name="web_password" type="password" {{ 'required minlength=10' if not editing }}></label><button type="submit">保存并开始运行</button> <button type="button" id="test-bark">测试 Bark</button> <button type="button" id="test-email">测试 Email</button><p id="result" role="status"></p></form>
<script>
const form=document.getElementById('setup'), result=document.getElementById('result'), val=n=>new FormData(form).get(n)||'';
form.addEventListener('submit',async e=>{e.preventDefault();let buys,sells;try{buys=JSON.parse(val('buys'));sells=JSON.parse(val('sells'))}catch{result.textContent='持仓 JSON 格式错误';return}const f=new FormData(form),body={tushare_token:val('tushare_token'),llm_provider:val('llm_provider'),llm_model:val('llm_model'),deepseek_api_key:val('deepseek_api_key'),openai_api_key:val('openai_api_key'),bark_enabled:f.has('bark_enabled'),bark_device_key:val('bark_device_key'),email_enabled:f.has('email_enabled'),smtp_host:val('smtp_host'),smtp_port:+val('smtp_port'),smtp_use_ssl:true,smtp_user:val('smtp_user'),smtp_password:val('smtp_password'),smtp_from:val('smtp_from'),smtp_to:val('smtp_to'),web_username:val('web_username'),web_password:val('web_password'),max_shares:+val('max_shares'),buys,sells,monitor_interval:+val('monitor_interval'),risk_warning:+val('risk_warning'),risk_critical:+val('risk_critical'),stabilization_threshold:+val('stabilization_threshold')};const r=await fetch('/api/setup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),d=await r.json();result.textContent=r.ok?'保存成功，请重新打开首页并登录':(d.detail||'保存失败');if(r.ok)setTimeout(()=>location.href='/',900)});
for(const kind of ['bark','email'])document.getElementById('test-'+kind).onclick=async()=>{const r=await fetch('/api/notifications/test-'+kind,{method:'POST'});result.textContent=r.ok&&((await r.json()).ok)?'测试发送成功':'测试未发送，请检查配置'};
</script></main></body></html>
